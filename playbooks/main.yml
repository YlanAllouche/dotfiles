        appearance_install_matugen: >-
          {{ _dotfiles_roles.get('appearance', {}).get('install_matugen', appearance_install_matugen) }}
        shell_enabled: "{{ _dotfiles_roles.get('shell', {}).get('enabled', shell_enabled) }}"
        shell_bootstrap_enabled: >-
          {{ _dotfiles_roles.get('shell', {}).get('bootstrap_enabled', shell_bootstrap_enabled) }}
        tty_enabled: "{{ _dotfiles_roles.get('tty', {}).get('enabled', tty_enabled) }}"
        tty_dv_enabled: "{{ _dotfiles_roles.get('tty', {}).get('dv_enabled', tty_dv_enabled) }}"
        tty_gh_enabled: "{{ _dotfiles_roles.get('tty', {}).get('gh_enabled', tty_gh_enabled) }}"
        tty_glab_enabled: "{{ _dotfiles_roles.get('tty', {}).get('glab_enabled', tty_glab_enabled) }}"
        tty_newsboat_enabled: >-
