        cloud_aws_enabled: "{{ _dotfiles_roles.get('cloud', {}).get('aws_enabled', cloud_aws_enabled) }}"
        cloud_fly_enabled: "{{ _dotfiles_roles.get('cloud', {}).get('fly_enabled', cloud_fly_enabled) }}"
        cloud_terraform_enabled: >-
          {{ _dotfiles_roles.get('cloud', {}).get('terraform_enabled', cloud_terraform_enabled) }}
        oci_enabled: "{{ _dotfiles_roles.get('oci', {}).get('enabled', oci_enabled) }}"
        oci_docker_enabled: "{{ _dotfiles_roles.get('oci', {}).get('docker_enabled', oci_docker_enabled) }}"
        oci_docker_compose_enabled: >-
          {{ _dotfiles_roles.get('oci', {}).get('docker_compose_enabled', oci_docker_compose_enabled) }}
        oci_docker_service_enabled: >-
          {{ _dotfiles_roles.get('oci', {}).get('docker_service_enabled', oci_docker_service_enabled) }}
        oci_podman_enabled: "{{ _dotfiles_roles.get('oci', {}).get('podman_enabled', oci_podman_enabled) }}"
        oci_minikube_enabled: >-
