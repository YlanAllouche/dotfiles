        oci_minikube_enabled: >-
          {{ _dotfiles_raw.oci_minikube_enabled if _dotfiles_raw.oci_minikube_enabled is not none else oci_minikube_enabled }}
        android_dev_enabled: >-
          {{ _dotfiles_raw.android_dev_enabled if _dotfiles_raw.android_dev_enabled != _dotfiles_base.get('android_dev_enabled') else android_dev_enabled }}
      vars:
        _dotfiles_raw: "{{ dotfiles_raw_role_vars_snapshot }}"
        _dotfiles_base: "{{ dotfiles_base_config }}"

    - name: Detect Homebrew prefix on macOS
      ansible.builtin.shell: |
        set -eu
        for brew_bin in /opt/homebrew/bin/brew /usr/local/bin/brew; do
          if [ -x "$brew_bin" ]; then
            "$brew_bin" --prefix
            exit 0
          fi
        done
        exit 1
      args:
        executable: /bin/sh
      register: homebrew_prefix_cmd
      changed_when: false
      when: is_macos | bool

    - name: Normalize package-manager helper paths
      ansible.builtin.set_fact:
        homebrew_prefix: "{{ homebrew_prefix_cmd.stdout if is_macos | bool else '' }}"
        pip3_executable: "{{ (homebrew_prefix_cmd.stdout ~ '/bin/pip3') if is_macos | bool else 'pip3' }}"
        python_user_base: "{{ active_home }}/.local"
        python_pip_environment:
          PYTHONUSERBASE: "{{ active_home }}/.local"

    - name: Refresh pacman package databases on Arch
      become: true
      community.general.pacman:
        update_cache: true
      when: is_archlinux | bool

    - name: Apply downstream flat role toggle overrides
      ansible.builtin.set_fact:
        aur_enabled: "{{ dotfiles_aur_enabled | default(aur_enabled) }}"
        identity_enabled: "{{ dotfiles_identity_enabled | default(identity_enabled) }}"
        appearance_enabled: "{{ dotfiles_appearance_enabled | default(appearance_enabled) }}"
        appearance_generate_wallpapers: >-
          {{ dotfiles_appearance_generate_wallpapers | default(appearance_generate_wallpapers) }}
        appearance_install_colorwhirl_target: >-
          {{ dotfiles_appearance_install_colorwhirl_target | default(appearance_install_colorwhirl_target) }}
        appearance_install_matugen: >-
          {{ dotfiles_appearance_install_matugen | default(appearance_install_matugen) }}
        shell_enabled: "{{ dotfiles_shell_enabled | default(shell_enabled) }}"
        shell_bootstrap_enabled: >-
          {{ dotfiles_shell_bootstrap_enabled | default(shell_bootstrap_enabled) }}
        tty_enabled: "{{ dotfiles_tty_enabled | default(tty_enabled) }}"
        tty_dv_enabled: "{{ dotfiles_tty_dv_enabled | default(tty_dv_enabled) }}"
        tty_gh_enabled: "{{ dotfiles_tty_gh_enabled | default(tty_gh_enabled) }}"
        tty_glab_enabled: "{{ dotfiles_tty_glab_enabled | default(tty_glab_enabled) }}"
        tty_newsboat_enabled: >-
          {{ dotfiles_tty_newsboat_enabled | default(tty_newsboat_enabled) }}
        tty_neofetch_enabled: >-
          {{ dotfiles_tty_neofetch_enabled | default(tty_neofetch_enabled) }}
        tty_pywal_enabled: "{{ dotfiles_tty_pywal_enabled | default(tty_pywal_enabled) }}"
        tty_tmux_bootstrap_enabled: >-
          {{ dotfiles_tty_tmux_bootstrap_enabled | default(tty_tmux_bootstrap_enabled) }}
        nvim_enabled: "{{ dotfiles_nvim_enabled | default(nvim_enabled) }}"
        nvim_bootstrap_plugins_enabled: >-
          {{ dotfiles_nvim_bootstrap_plugins_enabled | default(nvim_bootstrap_plugins_enabled) }}
        python_dev_enabled: "{{ dotfiles_python_dev_enabled | default(python_dev_enabled) }}"
        ecmascript_enabled: "{{ dotfiles_ecmascript_enabled | default(ecmascript_enabled) }}"
        golang_enabled: "{{ dotfiles_golang_enabled | default(golang_enabled) }}"
        tower_enabled: "{{ dotfiles_tower_enabled | default(tower_enabled) }}"
        tower_install_collections_enabled: >-
          {{ dotfiles_tower_install_collections_enabled | default(tower_install_collections_enabled) }}
        linux_desktop_enabled: >-
          {{ dotfiles_linux_desktop_enabled | default(linux_desktop_enabled) }}
        sound_enabled: "{{ dotfiles_sound_enabled | default(sound_enabled) }}"
        hyprland_enabled: "{{ dotfiles_hyprland_enabled | default(hyprland_enabled) }}"
        system_tty_login_enabled: >-
          {{ dotfiles_system_tty_login_enabled | default(system_tty_login_enabled) }}
        browser_base_enabled: >-
          {{ dotfiles_browser_base_enabled | default(browser_base_enabled) }}
        browser_personal_enabled: >-
          {{ dotfiles_browser_personal_enabled | default(browser_personal_enabled) }}
        browser_bitwarden_enabled: >-
