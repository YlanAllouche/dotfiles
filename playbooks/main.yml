        tty_pywal_enabled: "{{ _dotfiles_roles.get('tty', {}).get('pywal_enabled', tty_pywal_enabled) }}"
        tty_tmux_bootstrap_enabled: >-
          {{ _dotfiles_roles.get('tty', {}).get('tmux_bootstrap_enabled', tty_tmux_bootstrap_enabled) }}
        nvim_enabled: "{{ _dotfiles_roles.get('nvim', {}).get('enabled', nvim_enabled) }}"
