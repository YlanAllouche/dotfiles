- name: Apply dotfiles core
  hosts: all
  gather_facts: true

  vars:
    dotfiles_auto_consumer_config_file: >-
      {{
        lookup(
          'ansible.builtin.first_found',
          {'files': ['vars/dotfiles.consumer.yml'], 'paths': [playbook_dir]},
          errors='ignore'
        ) | default('', true)
      }}

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Normalize selected profile name
      ansible.builtin.set_fact:
        dotfiles_profile: "{{ vars.get('dotfiles_profile', 'base') }}"

    - name: Load base public vars for compatibility precedence checks
      ansible.builtin.include_vars:
        file: ../group_vars/all.yml
        name: dotfiles_base_config

    - name: Load selected public profile vars
      ansible.builtin.include_vars:
        file: "../vars/profiles/{{ dotfiles_profile }}.yml"

    - name: Normalize runtime user and platform variables
      ansible.builtin.set_fact:
        active_user: "{{ dotfiles_active_user | default(ansible_facts['user_id']) }}"
        active_home: >-
          {{
            dotfiles_active_home
            | default(
              lookup('env', 'HOME')
              if inventory_hostname == 'localhost'
              else (
                '/Users/' ~ (dotfiles_active_user | default(ansible_facts['user_id']))
                if ansible_facts['system'] == 'Darwin'
                else '/home/' ~ (dotfiles_active_user | default(ansible_facts['user_id']))
              )
            )
          }}
        platform_family: "{{ 'macos' if ansible_facts['system'] == 'Darwin' else 'linux' }}"
        is_macos: "{{ ansible_facts['system'] == 'Darwin' }}"
        is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
        is_wsl: "{{ ansible_facts['kernel'] is search('WSL') or ansible_facts['kernel'] is search('Microsoft') }}"
        is_archlinux: "{{ ansible_facts['distribution'] == 'Archlinux' }}"

    - name: Normalize runtime path variables
      ansible.builtin.set_fact:
        xdg_config_home: "{{ active_home }}/.config"
        xdg_data_home: "{{ active_home }}/.local/share"
        xdg_state_home: "{{ active_home }}/.local/state"
        xdg_cache_home: "{{ active_home }}/.cache"
        local_bin_dir: "{{ active_home }}/.local/bin"
        consumer_contract_dir: "{{ active_home }}/.config/dotfiles"
        consumer_contract_env_dir: "{{ active_home }}/.config/dotfiles/env"
        consumer_contract_docs_dir: "{{ active_home }}/.config/dotfiles/contracts"

    - name: Load consumer vars files
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: "{{ dotfiles_consumer_vars_files | default([]) }}"

    - name: Snapshot raw flat role vars for compatibility
      ansible.builtin.set_fact:
        dotfiles_raw_role_vars_snapshot:
          aur_enabled: "{{ vars.get('aur_enabled') }}"
          identity_enabled: "{{ vars.get('identity_enabled') }}"
          appearance_enabled: "{{ vars.get('appearance_enabled') }}"
          appearance_generate_wallpapers: "{{ vars.get('appearance_generate_wallpapers') }}"
          appearance_install_colorwhirl_target: "{{ vars.get('appearance_install_colorwhirl_target') }}"
          appearance_install_matugen: "{{ vars.get('appearance_install_matugen') }}"
          shell_enabled: "{{ vars.get('shell_enabled') }}"
          shell_bootstrap_enabled: "{{ vars.get('shell_bootstrap_enabled') }}"
          tty_enabled: "{{ vars.get('tty_enabled') }}"
          tty_dv_enabled: "{{ vars.get('tty_dv_enabled') }}"
          tty_gh_enabled: "{{ vars.get('tty_gh_enabled') }}"
          tty_glab_enabled: "{{ vars.get('tty_glab_enabled') }}"
          tty_newsboat_enabled: "{{ vars.get('tty_newsboat_enabled') }}"
          tty_neofetch_enabled: "{{ vars.get('tty_neofetch_enabled') }}"
          tty_pywal_enabled: "{{ vars.get('tty_pywal_enabled') }}"
          tty_tmux_bootstrap_enabled: "{{ vars.get('tty_tmux_bootstrap_enabled') }}"
          nvim_enabled: "{{ vars.get('nvim_enabled') }}"
          nvim_bootstrap_plugins_enabled: "{{ vars.get('nvim_bootstrap_plugins_enabled', none) }}"
          python_dev_enabled: "{{ vars.get('python_dev_enabled') }}"
          ecmascript_enabled: "{{ vars.get('ecmascript_enabled') }}"
          golang_enabled: "{{ vars.get('golang_enabled') }}"
          tower_enabled: "{{ vars.get('tower_enabled') }}"
          tower_install_collections_enabled: "{{ vars.get('tower_install_collections_enabled') }}"
          linux_desktop_enabled: "{{ vars.get('linux_desktop_enabled') }}"
          sound_enabled: "{{ vars.get('sound_enabled') }}"
          hyprland_enabled: "{{ vars.get('hyprland_enabled') }}"
          system_tty_login_enabled: "{{ vars.get('system_tty_login_enabled') }}"
          browser_base_enabled: "{{ vars.get('browser_base_enabled') }}"
          browser_personal_enabled: "{{ vars.get('browser_personal_enabled') }}"
          browser_bitwarden_enabled: "{{ vars.get('browser_bitwarden_enabled') }}"
          media_enabled: "{{ vars.get('media_enabled') }}"
          media_playlist_tools_enabled: "{{ vars.get('media_playlist_tools_enabled') }}"
          games_enabled: "{{ vars.get('games_enabled') }}"
          games_moonlight_client_enabled: "{{ vars.get('games_moonlight_client_enabled') }}"
          pkm_enabled: "{{ vars.get('pkm_enabled') }}"
          pim_enabled: "{{ vars.get('pim_enabled') }}"
          email_enabled: "{{ vars.get('email_enabled') }}"
          r_lang_enabled: "{{ vars.get('r_lang_enabled') }}"
          r_lang_radian_enabled: "{{ vars.get('r_lang_radian_enabled', none) }}"
          java_enabled: "{{ vars.get('java_enabled') }}"
          share_sync_enabled: "{{ vars.get('share_sync_enabled') }}"
          llm_enabled: "{{ vars.get('llm_enabled') }}"
          llm_opencode_enabled: "{{ vars.get('llm_opencode_enabled') }}"
          llm_claudecode_enabled: "{{ vars.get('llm_claudecode_enabled') }}"
          vscode_enabled: "{{ vars.get('vscode_enabled') }}"
          peripherals_enabled: "{{ vars.get('peripherals_enabled') }}"
          cloud_enabled: "{{ vars.get('cloud_enabled') }}"
          cloud_aws_enabled: "{{ vars.get('cloud_aws_enabled') }}"
          cloud_fly_enabled: "{{ vars.get('cloud_fly_enabled') }}"
          cloud_terraform_enabled: "{{ vars.get('cloud_terraform_enabled') }}"
          oci_enabled: "{{ vars.get('oci_enabled') }}"
          oci_docker_enabled: "{{ vars.get('oci_docker_enabled', none) }}"
          oci_docker_compose_enabled: "{{ vars.get('oci_docker_compose_enabled', none) }}"
          oci_docker_service_enabled: "{{ vars.get('oci_docker_service_enabled', none) }}"
          oci_podman_enabled: "{{ vars.get('oci_podman_enabled') }}"
          oci_minikube_enabled: "{{ vars.get('oci_minikube_enabled', none) }}"
          android_dev_enabled: "{{ vars.get('android_dev_enabled') }}"

    - name: Load optional structured consumer config
      ansible.builtin.include_vars:
        file: "{{ dotfiles_auto_consumer_config_file }}"
        name: dotfiles_consumer_config
      when: dotfiles_auto_consumer_config_file | length > 0

    - name: Apply structured consumer role overrides
      ansible.builtin.set_fact:
        aur_enabled: "{{ _dotfiles_roles.get('aur', {}).get('enabled', aur_enabled) }}"
        identity_enabled: "{{ _dotfiles_roles.get('identity', {}).get('enabled', identity_enabled) }}"
