        java_enabled: "{{ _dotfiles_roles.get('java', {}).get('enabled', java_enabled) }}"
        share_sync_enabled: "{{ _dotfiles_roles.get('share_sync', {}).get('enabled', share_sync_enabled) }}"
        llm_enabled: "{{ _dotfiles_roles.get('llm', {}).get('enabled', llm_enabled) }}"
