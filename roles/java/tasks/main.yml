- name: Install Java packages on Arch
  become: true
  community.general.pacman:
    name: "{{ java_arch_packages }}"
    state: present
  when: is_archlinux | bool

- name: Install Java packages on macOS
  community.general.homebrew:
    name: "{{ java_homebrew_packages }}"
    state: present
  when: is_macos | bool

- name: Ensure Java shell snippet directory exists
  ansible.builtin.file:
    path: "{{ active_home }}/.local/config/shell"
    state: directory
    mode: "0755"

- name: Install mise shell activation snippet
  ansible.builtin.copy:
    src: shell/40-mise.zsh
    dest: "{{ active_home }}/.local/config/shell/40-mise.zsh"
    mode: "0644"

- name: Ensure Java helper directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xdg_config_home }}/nvim/ftplugin"
    - "{{ xdg_config_home }}/nvim/lua/plugins"
    - "{{ xdg_config_home }}/nvim/scripts"
    - "{{ consumer_contract_dir }}"
    - "{{ consumer_contract_docs_dir }}"

- name: Install Java-specific Neovim overlays
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: nvim/ftplugin/java.lua
      dest: "{{ xdg_config_home }}/nvim/ftplugin/java.lua"
    - src: nvim/lua/jdtls_bootstrap.lua
      dest: "{{ xdg_config_home }}/nvim/lua/jdtls_bootstrap.lua"
    - src: nvim/lua/jdtls_env.lua
      dest: "{{ xdg_config_home }}/nvim/lua/jdtls_env.lua"
    - src: nvim/lua/java_projects.lua
      dest: "{{ xdg_config_home }}/nvim/lua/java_projects.lua"
    - src: nvim/lua/plugins/java.lua
      dest: "{{ xdg_config_home }}/nvim/lua/plugins/java.lua"
    - src: nvim/scripts/install-java-bundles.sh
      dest: "{{ xdg_config_home }}/nvim/scripts/install-java-bundles.sh"
      mode: "0755"
    - src: nvim/scripts/gradle-toolchains.sh
      dest: "{{ xdg_config_home }}/nvim/scripts/gradle-toolchains.sh"
      mode: "0755"
    - src: nvim/scripts/trust-corporate-certs.sh
      dest: "{{ xdg_config_home }}/nvim/scripts/trust-corporate-certs.sh"
      mode: "0755"

- name: Ensure global Java and Gradle toolchains are selected in mise
  ansible.builtin.command:
    cmd: >-
      {{ ((homebrew_prefix ~ '/bin/mise') if is_macos | bool else 'mise') }}
      use -g {{ java_mise_global_tools | join(' ') }}
  environment:
    HOME: "{{ active_home }}"
    XDG_CONFIG_HOME: "{{ xdg_config_home }}"
  changed_when: false

- name: Install configured Java and Gradle toolchains through mise
  ansible.builtin.command:
    cmd: >-
      {{ ((homebrew_prefix ~ '/bin/mise') if is_macos | bool else 'mise') }}
      install {{ java_mise_global_tools | join(' ') }}
  environment:
    HOME: "{{ active_home }}"
    XDG_CONFIG_HOME: "{{ xdg_config_home }}"
  changed_when: false

- name: Refresh Gradle toolchain paths from mise installs
  ansible.builtin.command:
    cmd: "{{ xdg_config_home }}/nvim/scripts/gradle-toolchains.sh"
  environment:
    HOME: "{{ active_home }}"
  changed_when: false

- name: Check pinned Java bundle artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ xdg_data_home }}/nvim/java-bundles/vscode-java-debug/extension/server/com.microsoft.java.debug.plugin-0.59.2026072407.jar"
    - "{{ xdg_data_home }}/nvim/java-bundles/vscode-java-test/extension/server/com.microsoft.java.test.plugin-0.46.2026072702.jar"
  register: java_bundle_artifacts

- name: Install Java debug and test bundles
  ansible.builtin.command:
    cmd: "{{ xdg_config_home }}/nvim/scripts/install-java-bundles.sh"
  environment:
    HOME: "{{ active_home }}"
    XDG_DATA_HOME: "{{ xdg_data_home }}"
    XDG_CACHE_HOME: "{{ xdg_cache_home }}"
  when: java_bundle_artifacts.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

- name: Install jdtls through Mason when plugin bootstrap is enabled
  ansible.builtin.command:
    cmd: nvim --headless "+MasonInstall jdtls" +qa
  environment:
    HOME: "{{ active_home }}"
    XDG_CONFIG_HOME: "{{ xdg_config_home }}"
    XDG_DATA_HOME: "{{ xdg_data_home }}"
    XDG_STATE_HOME: "{{ xdg_state_home }}"
    XDG_CACHE_HOME: "{{ xdg_cache_home }}"
  args:
    creates: "{{ xdg_data_home }}/mason/packages/jdtls/lombok.jar"
  when: nvim_bootstrap_plugins_enabled | bool

- name: Install Java setup notes on the target
  ansible.builtin.template:
    src: java.todo.j2
    dest: "{{ consumer_contract_docs_dir }}/java.todo"
    mode: "0644"
