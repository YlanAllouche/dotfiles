        pkm_enabled: "{{ _dotfiles_roles.get('pkm', {}).get('enabled', pkm_enabled) }}"
        pim_enabled: "{{ _dotfiles_roles.get('pim', {}).get('enabled', pim_enabled) }}"
        email_enabled: "{{ _dotfiles_roles.get('email', {}).get('enabled', email_enabled) }}"
        r_lang_enabled: "{{ _dotfiles_roles.get('r_lang', {}).get('enabled', r_lang_enabled) }}"
        r_lang_radian_enabled: >-
