        android_dev_enabled: >-
          {{ _dotfiles_roles.get('android_dev', {}).get('enabled', android_dev_enabled) }}
      vars:
        _dotfiles_roles: >-
          {{
            (dotfiles_consumer_config.dotfiles_roles | default({}))
            | combine(dotfiles_roles | default({}), recursive=True)
          }}

